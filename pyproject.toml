[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apmt-solar"
version = "1.9.0"
description = "APMT/Solar: a provenance-first perovskite/silicon tandem photovoltaic modelling platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary research use" }
authors = [{ name = "APMT/Solar project" }]

# Version bounds are chosen to be mutually compatible and are the versions the
# V1.8/V1.9 test suite has actually been executed against (see
# manifests/v1.8_reproducibility_manifest.json for the exact environment pins).
dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.11,<2.0",
    "pvlib>=0.10,<1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
digitization = ["pymupdf>=1.24"]     # needed only to re-render figure pages from the manuscript PDF
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
apmt-calibrate = "apmt.cli:main"

[tool.setuptools]
packages = [
    "apmt", "apmt.core", "apmt.params", "apmt.spectra", "apmt.materials",
    "apmt.optics", "apmt.device", "apmt.inference", "apmt.validation",
    "apmt.experiments", "apmt.multifidelity", "apmt.sensitivity",
    "apmt.optimize", "apmt.surrogate", "apmt.uq", "apmt.discovery",
    "apmt.reproducibility", "apmt.results", "apmt.voi", "apmt.synthetic",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]
markers = [
    "slow: tests that run a full model campaign (may take minutes)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
